<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <title>Xổ Số Miền Nam - Kết Quả XSMN</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&family=Roboto+Mono:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M2 9a3 3 0 0 1 0 6v4a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-4a3 3 0 0 1 0-6V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z" />
              <path d="M13 5v2" />
              <path d="M13 11v2" />
              <path d="M13 17v2" />
              <circle cx="8" cy="12" r="2.2" fill="currentColor" />
            </svg>
          </div>
          <div class="brand-meta">
            <h1 class="brand-title">
              <span class="brand-title-full">Xổ Số Miền Nam</span>
              <span class="brand-title-short" aria-hidden="true">XSMN</span>
            </h1>
            <span class="brand-badge">Trực tiếp</span>
          </div>
        </div>

        <form id="pick-date" class="pick-date-form">
          <label for="date-input" class="sr-only">Chọn ngày</label>
          <input
            id="date-input"
            type="date"
            aria-label="Chọn ngày xem kết quả"
          />
          <button type="submit" id="btn-submit">Xem</button>
        </form>
      </div>
    </header>

    <main class="app-main">
      <nav id="day-tabs" aria-label="Chọn ngày gần đây"></nav>

      <div class="status-row">
        <div class="day-title-wrap">
          <svg
            class="day-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
            <line x1="16" x2="16" y1="2" y2="6" />
            <line x1="8" x2="8" y1="2" y2="6" />
            <line x1="3" x2="21" y1="10" y2="10" />
          </svg>
          <h2 id="day-label"></h2>
        </div>
      </div>

      <p id="error" role="alert" hidden></p>

      <div id="board" class="board-container"></div>
    </main>

    <p id="toast" hidden role="status"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
