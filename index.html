<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7f8" />
    <title>Starter App</title>
  </head>
  <body>
    <main class="shell">
      <span class="mark" aria-hidden="true">S</span>
      <h1>Starter App</h1>
      <p id="build" class="build">Bundle: …</p>
      <p id="status" class="status" aria-live="polite">Checking for updates…</p>
      <div class="actions">
        <button id="download" class="btn btn-primary" type="button" hidden>
          Download
        </button>
        <button id="later" class="btn" type="button" hidden>Later</button>
        <button id="retry" class="btn btn-primary" type="button" hidden>
          Retry
        </button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
