<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3d7b8" />
    <title>Việc cần làm</title>
  </head>
  <body>
    <div id="update-bar" class="update-bar glass" hidden>
      <p id="update-text">Có bản cập nhật mới.</p>
      <div class="update-actions">
        <button id="download" class="btn btn-primary" type="button">Tải về</button>
        <button id="later" class="btn" type="button">Để sau</button>
      </div>
    </div>

    <header class="top glass">
      <div class="brand">
        <span class="mark" aria-hidden="true">V</span>
        <div>
          <p class="brand-name">Việc cần làm</p>
          <p id="build" class="build">Bản: …</p>
        </div>
      </div>
      <button id="check-update" class="text-btn" type="button">Cập nhật</button>
    </header>

    <main>
      <section class="intro" aria-labelledby="intro-title">
        <p class="eyebrow">Danh sách việc</p>
        <h1 id="intro-title">Hôm nay làm gì?</h1>
        <p id="summary" class="lede">Chưa có việc nào.</p>
      </section>

      <section class="board glass">
        <form id="todo-form" class="composer" autocomplete="off">
          <label class="sr-only" for="todo-input">Việc mới</label>
          <input id="todo-input" name="title" maxlength="120" placeholder="Thêm việc…" required />
          <button class="btn btn-primary" type="submit">Thêm</button>
        </form>

        <div class="toolbar">
          <div class="filters" role="tablist" aria-label="Lọc việc">
            <button id="filter-all" class="chip is-on" type="button" data-filter="all">Tất cả</button>
            <button id="filter-open" class="chip" type="button" data-filter="open">Đang làm</button>
            <button id="filter-done" class="chip" type="button" data-filter="done">Xong</button>
          </div>
          <button id="clear-done" class="text-btn" type="button">Xóa việc đã xong</button>
        </div>

        <ul id="todo-list" class="todo-list"></ul>
        <p id="empty" class="empty">Chưa có việc trong mục này.</p>
      </section>
    </main>

    <p id="toast" class="toast glass" hidden role="status"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
