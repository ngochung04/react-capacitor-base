name: OTA

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OTA_GITHUB_REPO: ${{ github.repository }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Zip OTA bundle
        run: |
          rm -f ota-bundle.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('dist')
          with zipfile.ZipFile('ota-bundle.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
            TAG="${VERSION}"
          fi
          gh release create "${TAG}" ota-bundle.zip \
            --title "OTA ${VERSION}" \
            --notes "Web bundle ${VERSION}. The app checks GitHub Releases for this zip." \
            --latest
