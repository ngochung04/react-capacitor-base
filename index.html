<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3d7b8" />
    <title>Kết quả xổ số Miền Nam</title>
  </head>
  <body>
    <div id="update-bar" class="update-bar glass" hidden>
      <p id="update-text">Có bản cập nhật mới.</p>
      <div class="update-actions">
        <button id="download" class="btn btn-primary" type="button">Tải về</button>
        <button id="later" class="btn" type="button">Để sau</button>
      </div>
    </div>

    <header class="top glass">
      <div class="brand">
        <span class="mark" aria-hidden="true">XS</span>
        <div>
          <p class="brand-name">Xổ số Miền Nam</p>
          <p id="build" class="build">Bản: …</p>
        </div>
      </div>
      <div class="top-actions">
        <button id="refresh" class="text-btn" type="button">Tải lại</button>
        <button id="check-update" class="text-btn" type="button">Cập nhật</button>
      </div>
    </header>

    <main>
      <nav id="day-tabs" class="day-tabs" aria-label="Chọn ngày"></nav>

      <p id="error" class="error" role="alert" hidden></p>

      <div class="board glass">
        <p id="day-label" class="day-label">Đang tải…</p>
        <div id="board" class="table-wrap"></div>
      </div>
    </main>

    <p id="toast" class="toast glass" hidden role="status"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
